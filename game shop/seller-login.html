<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Login | GAME SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/seller.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page seller-page">
  <main class="auth-shell">
    <div class="auth-card seller-card">
      <div class="auth-header"><a href="index.html" class="brand"><span class="brand-mark">G</span><span>GAME SHOP</span></a><h1>Seller access</h1></div>
      <form id="seller-login-form" class="auth-form">
        <div class="field-group"><label>Email</label><input type="email" id="seller-email" required /></div>
        <div class="field-group"><label>Password</label><div class="password-wrap"><input type="password" id="seller-password" required /><button type="button" class="toggle-password">Show</button></div></div>
        <button class="btn btn-primary full-width" type="submit">Seller login</button>
      </form>
      <p class="auth-switch"><a href="login.html">Back to buyer login</a></p>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/seller.js"></script>
</body>
</html>
