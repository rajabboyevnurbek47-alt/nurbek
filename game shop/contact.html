<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | GAME SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand"><span class="brand-mark">G</span><span>GAME SHOP</span></a>
      <nav class="main-nav"><a href="index.html">Home</a><a href="catalog.html">Catalog</a><a href="about.html">About</a><a href="contact.html" class="active">Contact</a></nav>
    </div>
  </header>

  <main class="page-shell">
    <div class="container contact-layout">
      <div class="auth-card">
        <h1>Contact us</h1>
        <form class="auth-form">
          <div class="field-group"><label>Name</label><input type="text" /></div>
          <div class="field-group"><label>Email</label><input type="email" /></div>
          <div class="field-group"><label>Message</label><textarea rows="5"></textarea></div>
          <button class="btn btn-primary" type="button">Send message</button>
        </form>
      </div>
      <div class="auth-card contact-info">
        <h3>Support</h3>
        <p>Email: support@gameshop.example</p>
        <p>Phone: +1 (555) 013-2048</p>
        <p>Hours: Mon-Sat 9:00 to 20:00</p>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="footer-bottom"><div class="container"><span>© <span id="year"></span> GAME SHOP</span></div></div></footer>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
