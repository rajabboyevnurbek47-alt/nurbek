<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | GAME SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header"><a href="index.html" class="brand"><span class="brand-mark">G</span><span>GAME SHOP</span></a><h1>Create account</h1></div>
      <form id="register-form" class="auth-form">
        <div class="field-row two-col">
          <div class="field-group"><label>Full name</label><input type="text" id="register-name" required /></div>
          <div class="field-group"><label>Username</label><input type="text" id="register-username" required /></div>
        </div>
        <div class="field-group"><label>Email</label><input type="email" id="register-email" required /></div>
        <div class="field-group"><label>Password</label><div class="password-wrap"><input type="password" id="register-password" required /><button type="button" class="toggle-password">Show</button></div></div>
        <div class="field-group"><label>Confirm password</label><div class="password-wrap"><input type="password" id="register-confirm" required /><button type="button" class="toggle-password">Show</button></div></div>
        <button class="btn btn-primary full-width" type="submit">Register</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
