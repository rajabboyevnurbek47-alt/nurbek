<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | GAME SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/seller.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="seller-layout">
  <aside class="seller-sidebar">
    <div class="brand-box"><a href="index.html" class="brand"><span class="brand-mark">G</span><span>GAME SHOP</span></a></div>
    <nav>
      <a href="seller-dashboard.html">Dashboard</a>
      <a href="seller-products.html">Products</a>
      <a href="seller-add-product.html" class="active">Add product</a>
      <a href="seller-orders.html">Orders</a>
      <a href="index.html">Exit</a>
    </nav>
  </aside>
  <main class="seller-main">
    <div class="seller-topbar"><h1>Add new product</h1></div>
    <form id="add-product-form" class="seller-product-form">
      <div class="field-row two-col">
        <div class="field-group"><label>Game title</label><input type="text" name="title" required /></div>
        <div class="field-group"><label>Genre</label><input type="text" name="genre" required /></div>
      </div>
      <div class="field-row two-col">
        <div class="field-group"><label>Platform</label><input type="text" name="platform" required /></div>
        <div class="field-group"><label>Price</label><input type="number" step="0.01" name="price" required /></div>
      </div>
      <div class="field-group"><label>Description</label><textarea name="description" rows="4" required></textarea></div>
      <button class="btn btn-primary" type="submit">Publish product</button>
    </form>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/seller.js"></script>
</body>
</html>
