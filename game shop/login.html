<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | GAME SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-header"><a href="index.html" class="brand"><span class="brand-mark">G</span><span>GAME SHOP</span></a><h1>Welcome back</h1></div>
      <form id="login-form" class="auth-form">
        <div class="field-group"><label>Email or username</label><input type="text" id="login-identifier" required /></div>
        <div class="field-group"><label>Password</label><div class="password-wrap"><input type="password" id="login-password" required /><button type="button" class="toggle-password">Show</button></div></div>
        <button class="btn btn-primary full-width" type="submit">Login</button>
      </form>
      <p class="auth-switch">Need an account? <a href="register.html">Create one</a></p>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
